# =============================================================================
# migrar-secretos-constructor.yml — TEMPORAL (P5, paso N8, decisión D4)
# -----------------------------------------------------------------------------
# Copia los valores de los secretos de GitHub del Environment `staging`
# SITIOS_TENANT y SITIO_NEGOCIO_T1 a los secretos de Secret Manager del mismo
# nombre (creados vacíos en N7), como su primera versión. El valor viaja solo
# por stdin (`printf` es un builtin de bash: no aparece en argumentos de
# procesos), nunca por argumentos, `echo` ni registros; GitHub además lo
# enmascara. Si un secreto ya tiene alguna versión, no se toca (idempotente).
#
# ANTES DE CORRERLO (lo hace la sesión principal, con autorización de Andres;
# no este workflow ni el agente que lo escribió):
#   - Otorgar a la SA de deploy de staging (secrets.GCP_SA_DEPLOY_STAGING),
#     SOLO sobre los secretos SITIOS_TENANT y SITIO_NEGOCIO_T1:
#       roles/secretmanager.secretVersionAdder  (versions.add)
#     y, para la comprobación «¿ya tiene versión?», un rol que dé
#     secretmanager.versions.list sin leer el valor, p. ej.
#       roles/secretmanager.viewer              (no incluye versions.access)
#     Sin ese permiso de lista el workflow falla cerrado y no agrega nada.
#   - Ambos permisos son temporales: se quitan (remove-iam-policy-binding)
#     después de la corrida y de verificar `gcloud secrets versions list`.
#
# CICLO DE VIDA: este workflow se borra en un PR posterior (N8 d), una vez
# verificada la corrida. No debe quedar en main.
#
# Disparo: solo workflow_dispatch desde main. Identidad: WIF + impersonación,
# igual que desplegar-staging en ci-node-firebase.yml (sin JSON de SA).
# Secretos: GCP_WIF_PROVIDER, GCP_SA_DEPLOY_STAGING, SITIOS_TENANT,
#           SITIO_NEGOCIO_T1 (Environment staging)
# Variables: GCP_PROJECT_ID_STAGING (Environment staging)
# =============================================================================
name: Migrar secretos del constructor (temporal)

on:
  workflow_dispatch:

# Mínimo global; el job eleva solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: migrar-secretos-constructor
  cancel-in-progress: false

jobs:
  migrar-secretos:
    name: migrar-secretos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deployment: false — usa los secretos y variables del Environment sin
    # crear un registro de despliegue (no despliega nada).
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      id-token: write # token OIDC para WIF
    steps:
      - name: Autenticar en GCP (WIF + impersonación de la SA de deploy)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_STAGING }}

      - name: gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Agregar la primera versión (solo si el secreto no tiene ninguna)
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          VALOR_SITIOS_TENANT: ${{ secrets.SITIOS_TENANT }}
          VALOR_SITIO_NEGOCIO_T1: ${{ secrets.SITIO_NEGOCIO_T1 }}
        run: |
          set -euo pipefail
          [[ -n "$PROYECTO" ]] \
            || { echo "::error::Falta la variable GCP_PROJECT_ID_STAGING del Environment staging."; exit 1; }

          migrar() {
            local nombre="$1" var="VALOR_$1" versiones
            # Valor por expansión indirecta: nunca se imprime ni va en argumentos.
            if [[ -z "${!var}" ]]; then
              echo "::error::El secreto de GitHub ${nombre} del Environment staging está vacío o no existe."
              return 1
            fi
            # Lista los nombres de versión (cualquier estado); no lee el valor.
            if ! versiones="$(gcloud secrets versions list "$nombre" \
                --project "$PROYECTO" --format='value(name)' --limit=1)"; then
              echo "::error::No se pudieron listar las versiones de ${nombre} (¿existe el secreto? ¿falta secretmanager.versions.list temporal?). No se agrega nada."
              return 1
            fi
            if [[ -n "$versiones" ]]; then
              echo "${nombre}: ya tiene al menos una versión; no se hace nada."
              return 0
            fi
            printf '%s' "${!var}" \
              | gcloud secrets versions add "$nombre" --data-file=- \
                  --project "$PROYECTO" --format='value(name)' >/dev/null
            echo "${nombre}: versión agregada."
          }

          migrar SITIOS_TENANT
          migrar SITIO_NEGOCIO_T1
